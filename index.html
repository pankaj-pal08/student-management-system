<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage Student Records Easily</p>
    </header>

    <main class="container">

        <section class="dashboard">
            <div class="card">
                <h3>Total Students</h3>
                <h2 id="totalStudents">0</h2>
            </div>
            <div class="card">
                <h3>Average Marks</h3>
                <h2 id="averageMarks">0</h2>
            </div>
        </section>

        <section class="form-section">
            <h2>Add Student</h2>

            <form id="studentForm">
                <input type="text" id="name" placeholder="Student Name" required>
                <input type="text" id="roll" placeholder="Roll Number" required>
                <input type="text" id="course" placeholder="Course" required>
                <input type="number" id="marks" placeholder="Marks (0-100)" min="0" max="100" required>

                <button type="submit" id="submitBtn">Add Student</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Student Records</h2>

            <input type="text" id="search" placeholder="Search by name or roll number">

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll No.</th>
                            <th>Course</th>
                            <th>Marks</th>
                            <th>Grade</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentList"></tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>Student Management System | Created by Pankaj Pal</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
